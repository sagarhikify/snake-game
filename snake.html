<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    h1 { color: #00ff88; margin-bottom: 10px; font-size: clamp(1.5rem, 5vw, 2.5rem); }
    .score-board { display: flex; gap: 20px; margin-bottom: 10px; color: #fff; font-size: clamp(1rem, 3vw, 1.5rem); }
    #gameCanvas { background: #0f0f23; border: 3px solid #00ff88; border-radius: 8px; box-shadow: 0 0 20px rgba(0, 255, 136, 0.3); touch-action: none; }
    .controls { display: none; gap: 10px; margin-top: 15px; }
    .control-row { display: flex; gap: 10px; justify-content: center; }
    .btn {
      width: 60px; height: 60px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(145deg, #2a2a4a, #1a1a2e);
      color: #00ff88;
      font-size: 24px;
      box-shadow: 5px 5px 10px #0a0a1a, -5px -5px 10px #3a3a5a;
      touch-action: manipulation;
      user-select: none;
    }
    .btn:active { background: linear-gradient(145deg, #1a1a2e, #2a2a4a); transform: scale(0.95); }
    @media (max-width: 600px) {
      .controls { display: flex; flex-direction: column; }
      #gameCanvas { max-width: 95vw; max-height: 60vh; }
    }
    .overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 100;
      color: #fff;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: clamp(2rem, 8vw, 3rem); margin-bottom: 10px; color: #00ff88; }
    .overlay p { font-size: clamp(1rem, 4vw, 1.5rem); margin-bottom: 20px; }
    .overlay button {
      padding: 15px 40px;
      font-size: clamp(1rem, 3vw, 1.3rem);
      border: none;
      border-radius: 8px;
      background: #00ff88;
      color: #0f0f23;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>SNAKE</h1>
  <div class="score-board">
    <div>Score: <span id="score">0</span></div>
    <div>High: <span id="highScore">0</span></div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div class="controls" id="controls">
    <div class="control-row"><button class="btn" data-dir="up">▲</button></div>
    <div class="control-row">
      <button class="btn" data-dir="left">◄</button>
      <button class="btn" data-dir="right">►</button>
    </div>
    <div class="control-row"><button class="btn" data-dir="down">▼</button></div>
  </div>
  <div class="overlay" id="startOverlay">
    <h2>SNAKE</h2>
    <p>Eat the food, grow longer, don't hit walls or yourself!</p>
    <button id="startBtn">Start Game</button>
  </div>
  <div class="overlay hidden" id="gameOverOverlay">
    <h2>GAME OVER</h2>
    <p>Final Score: <span id="finalScore">0</span></p>
    <button id="restartBtn">Play Again</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const controls = document.getElementById('controls');

    const GRID_SIZE = 20;
    let gridWidth, gridHeight;
    let snake, food, direction, nextDirection, score, highScore, gameLoop, gameSpeed;
    const INITIAL_SPEED = 150;
    const MIN_SPEED = 60;

    function resizeCanvas() {
      const maxWidth = Math.min(window.innerWidth * 0.95, 600);
      const maxHeight = window.innerHeight * 0.65;
      gridWidth = Math.floor(maxWidth / GRID_SIZE);
      gridHeight = Math.floor(maxHeight / GRID_SIZE);
      canvas.width = gridWidth * GRID_SIZE;
      canvas.height = gridHeight * GRID_SIZE;
    }

    function initGame() {
      resizeCanvas();
      snake = [{ x: Math.floor(gridWidth / 2), y: Math.floor(gridHeight / 2) }];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      gameSpeed = INITIAL_SPEED;
      spawnFood();
      scoreEl.textContent = score;
      highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
      highScoreEl.textContent = highScore;
    }

    function spawnFood() {
      let newFood;
      do {
        newFood = {
          x: Math.floor(Math.random() * gridWidth),
          y: Math.floor(Math.random() * gridHeight)
        };
      } while (snake.some(seg => seg.x === newFood.x && seg.y === newFood.y));
      food = newFood;
    }

    function update() {
      direction = { ...nextDirection };
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      if (head.x < 0 || head.x >= gridWidth || head.y < 0 || head.y >= gridHeight ||
          snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('snakeHighScore', highScore);
        }
        gameSpeed = Math.max(MIN_SPEED, INITIAL_SPEED - score * 2);
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.fillStyle = '#0f0f23';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00ff88';
      ctx.shadowColor = '#00ff88';
      ctx.shadowBlur = 10;
      snake.forEach((seg, i) => {
        const x = seg.x * GRID_SIZE;
        const y = seg.y * GRID_SIZE;
        const padding = i === 0 ? 1 : 2;
        ctx.fillRect(x + padding, y + padding, GRID_SIZE - padding * 2, GRID_SIZE - padding * 2);
      });
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#ff3366';
      ctx.shadowColor = '#ff3366';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(food.x * GRID_SIZE + GRID_SIZE / 2, food.y * GRID_SIZE + GRID_SIZE / 2, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function gameLoopFn() {
      update();
      draw();
      gameLoop = setTimeout(gameLoopFn, gameSpeed);
    }

    function gameOver() {
      clearTimeout(gameLoop);
      finalScoreEl.textContent = score;
      gameOverOverlay.classList.remove('hidden');
    }

    function startGame() {
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      initGame();
      gameLoopFn();
    }

    function changeDirection(newDir) {
      if ((newDir.x !== -direction.x || newDir.y !== -direction.y) &&
          (newDir.x !== 0 || newDir.y !== 0)) {
        nextDirection = newDir;
      }
    }

    document.addEventListener('keydown', e => {
      const keyMap = { ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 }, ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
        KeyW: { x: 0, y: -1 }, KeyS: { x: 0, y: 1 }, KeyA: { x: -1, y: 0 }, KeyD: { x: 1, y: 0 } };
      if (keyMap[e.code]) { e.preventDefault(); changeDirection(keyMap[e.code]); }
    });

    document.querySelectorAll('.btn[data-dir]').forEach(btn => {
      btn.addEventListener('click', () => {
        const dirs = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
        changeDirection(dirs[btn.dataset.dir]);
      });
    });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    window.addEventListener('resize', () => {
      if (!startOverlay.classList.contains('hidden') && !gameOverOverlay.classList.contains('hidden')) return;
      const oldWidth = gridWidth, oldHeight = gridHeight;
      resizeCanvas();
      snake = snake.map(seg => ({ x: Math.min(seg.x, gridWidth - 1), y: Math.min(seg.y, gridHeight - 1) }));
      food.x = Math.min(food.x, gridWidth - 1);
      food.y = Math.min(food.y, gridHeight - 1);
    });

    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, { passive: true });
    canvas.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy)) changeDirection({ x: dx > 0 ? 1 : -1, y: 0 });
      else changeDirection({ x: 0, y: dy > 0 ? 1 : -1 });
    }, { passive: true });

    if ('ontouchstart' in window) controls.style.display = 'flex';

    initGame();
    draw();
  </script>
</body>
</html>
